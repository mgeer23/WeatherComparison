name: Daily Weather Collection

on:
  schedule:
    - cron: '0 9 * * *'  # Runs at 09:00 UTC every day
  workflow_dispatch:       # Allows manual runs from the GitHub UI

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests python-dotenv supabase

      - name: Run daily collection
        env:
          ACCU_KEY: ${{ secrets.ACCU_KEY }}
          MET_KEY: ${{ secrets.MET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python daily_supabase.py
